<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>JUICE-MAN - Level 2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
window.addEventListener('resize',resize);resize();
function loop(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);
  const cx=canvas.width/2,cy=canvas.height/2;
  ctx.fillStyle='#ffff00';
  ctx.font=`bold ${Math.min(48,canvas.width*0.07)}px monospace`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('LEVEL 2',cx,cy-60);
  ctx.fillStyle='#fff';
  ctx.font=`${Math.min(24,canvas.width*0.04)}px monospace`;
  ctx.fillText('COMING SOON',cx,cy);
  ctx.fillStyle='#888';
  ctx.font=`${Math.min(16,canvas.width*0.025)}px monospace`;
  ctx.fillText('Theme to be decided by community PRs',cx,cy+50);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
