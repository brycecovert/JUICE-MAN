name: Promote JUICE-MAN Version
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect merged version
        id: detect
        run: |
          # Check if this push merged a versioned file
          # Look for levels/level_N_vN.html in the latest commit
          MERGED_FILE=$(git diff --name-only HEAD~1 HEAD | grep -E '^levels/level_[0-9]+_v[0-9]+\.html$' | head -n 1)
          
          if [ -z "$MERGED_FILE" ]; then
            echo "No versioned file detected in this push. Skipping promotion."
            echo "has_version=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "Detected merged file: $MERGED_FILE"
          
          LEVEL=$(echo "$MERGED_FILE" | sed -E 's|levels/level_([0-9]+)_v[0-9]+\.html|\1|')
          VERSION=$(echo "$MERGED_FILE" | sed -E 's|levels/level_[0-9]+_v([0-9]+)\.html|\1|')
          CANONICAL_FILE="levels/level_${LEVEL}.html"
          NEXT_VERSION_FILE="specs/level_${LEVEL}/next_version"
          CREDITS_FILE="credits/level_${LEVEL}_credits.md"
          
          echo "level=$LEVEL" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "merged_file=$MERGED_FILE" >> $GITHUB_OUTPUT
          echo "canonical_file=$CANONICAL_FILE" >> $GITHUB_OUTPUT
          echo "next_version_file=$NEXT_VERSION_FILE" >> $GITHUB_OUTPUT
          echo "credits_file=$CREDITS_FILE" >> $GITHUB_OUTPUT
          echo "has_version=true" >> $GITHUB_OUTPUT

      - name: Promote to canonical path
        if: steps.detect.outputs.has_version == 'true'
        run: |
          LEVEL="${{ steps.detect.outputs.level }}"
          VERSION="${{ steps.detect.outputs.version }}"
          MERGED_FILE="${{ steps.detect.outputs.merged_file }}"
          CANONICAL_FILE="${{ steps.detect.outputs.canonical_file }}"
          
          # Preserve v0 baseline on first promotion
          V0_FILE="levels/level_${LEVEL}_v0.html"
          if [ "$VERSION" = "1" ] && [ ! -f "$V0_FILE" ]; then
            git show HEAD~1:"$CANONICAL_FILE" > "$V0_FILE" 2>/dev/null || cp "$CANONICAL_FILE" "$V0_FILE"
            echo "Preserved v0 baseline: $V0_FILE"
          fi
          
          cp "$MERGED_FILE" "$CANONICAL_FILE"
          echo "Promoted $MERGED_FILE -> $CANONICAL_FILE"

      - name: Increment next_version
        if: steps.detect.outputs.has_version == 'true'
        run: |
          NEXT_VERSION_FILE="${{ steps.detect.outputs.next_version_file }}"
          CURRENT=$(cat "$NEXT_VERSION_FILE" | tr -d '[:space:]')
          NEXT=$((CURRENT + 1))
          echo "$NEXT" > "$NEXT_VERSION_FILE"
          echo "Updated next_version: $CURRENT -> $NEXT"

      - name: Update credits
        if: steps.detect.outputs.has_version == 'true'
        run: |
          CREDITS_FILE="${{ steps.detect.outputs.credits_file }}"
          LEVEL="${{ steps.detect.outputs.level }}"
          VERSION="${{ steps.detect.outputs.version }}"
          
          # Get the PR author from the merge commit
          # The merge commit message typically contains the PR number
          # We'll use the commit author as a fallback
          AUTHOR=$(git log -1 --format='%an' HEAD)
          
          # Try to get PR author from the merge commit if available
          PR_NUMBER=$(git log -1 --format='%B' HEAD | grep -oE '#[0-9]+' | head -n 1 | tr -d '#')
          if [ -n "$PR_NUMBER" ]; then
            echo "Detected PR #${PR_NUMBER}"
          fi
          
          # Append to credits file
          echo "- ${AUTHOR} — v${VERSION}" >> "$CREDITS_FILE"
          echo "Updated credits: Added ${AUTHOR} for v${VERSION}"

      - name: Update README.md
        if: steps.detect.outputs.has_version == 'true'
        run: |
          LEVEL="${{ steps.detect.outputs.level }}"
          VERSION="${{ steps.detect.outputs.version }}"
          AUTHOR=$(git log -1 --format='%an' HEAD)
          DATE=$(date +%Y-%m-%d)
          SPEC_FILE="specs/level_${LEVEL}/v${VERSION}.md"
          
          # Read spec for description (first line, max 100 chars)
          SPEC_DESC="Generated from community spec"
          if [ -f "$SPEC_FILE" ]; then
            FIRST_LINE=$(head -n 1 "$SPEC_FILE" | sed 's/^#* *//' | cut -c1-100)
            if [ -n "$FIRST_LINE" ]; then
              SPEC_DESC="$FIRST_LINE"
            fi
          fi
          
          node -e "
            const fs = require('fs');
            let readme = fs.readFileSync('README.md', 'utf8');
            
            const version = '${VERSION}';
            const level = '${LEVEL}';
            const author = '${AUTHOR}';
            const date = '${DATE}';
            const desc = '${SPEC_DESC}';
            
            // Update Official Releases table for Level 1
            const levelTableRegex = new RegExp('(### Level ' + level + '\\s*\\n\\s*\\n\\| Version \\| Author \\| Play \\| Description \\|\\s*\\n\\|[-|\\s]+\\|\\s*\\n)');
            const levelMatch = readme.match(levelTableRegex);
            
            if (levelMatch) {
              const newRow = '| **v' + version + '** | ' + author + ' | [Play](levels/level_' + level + '_v' + version + '.html) | ' + desc + ' |\n';
              readme = readme.slice(0, levelMatch.index + levelMatch[0].length) + newRow + readme.slice(levelMatch.index + levelMatch[0].length);
            }
            
            // Update Release Log
            const logMatch = readme.match(/(## Release Log\s*\n\s*\n\| Version \| Date \| Juice-Man \| Changes \|\s*\n\|[-|\s]+\|\s*\n)/);
            if (logMatch) {
              const newLogRow = '| v' + version + ' | ' + date + ' | ' + author + ' | ' + desc + ' |\n';
              readme = readme.slice(0, logMatch.index + logMatch[0].length) + newLogRow + readme.slice(logMatch.index + logMatch[0].length);
            }
            
            // Update Current Status
            readme = readme.replace(
              /## Current Status\s*\n\s*\n.*?\n\n/,
              '## Current Status\n\nNightly builds active. Latest: **Level ' + level + ' v' + version + '** — ' + desc + '\n\n'
            );
            
            fs.writeFileSync('README.md', readme);
            console.log('README.md updated');
          "

      - name: Commit promotion changes
        if: steps.detect.outputs.has_version == 'true'
        run: |
          git config user.name "juice-man-bot"
          git config user.email "bot@juice-man.dev"
          
          LEVEL="${{ steps.detect.outputs.level }}"
          VERSION="${{ steps.detect.outputs.version }}"
          CANONICAL_FILE="${{ steps.detect.outputs.canonical_file }}"
          NEXT_VERSION_FILE="${{ steps.detect.outputs.next_version_file }}"
          CREDITS_FILE="${{ steps.detect.outputs.credits_file }}"
          V0_FILE="levels/level_${LEVEL}_v0.html"
          
          git add "$CANONICAL_FILE" "$NEXT_VERSION_FILE" "$CREDITS_FILE" README.md
          
          # Also add v0 file if it was just created
          if [ -f "$V0_FILE" ]; then
            git add "$V0_FILE"
          fi
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Promote level ${LEVEL} v${VERSION} to canonical path"
            git push origin main
            echo "Committed and pushed promotion changes"
          fi
