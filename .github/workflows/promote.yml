name: Promote JUICE-MAN Version
on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  promote:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect merged spec
        id: detect
        run: |
          # Check if this push merged a spec file
          MERGED_SPEC=$(git diff --name-only HEAD~1 HEAD | grep -E '^specs/level_[0-9]+/v[0-9]+\.md$' | head -n 1)
          
          if [ -z "$MERGED_SPEC" ]; then
            echo "No spec file detected in this push. Skipping promotion."
            echo "has_version=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          LEVEL=$(echo "$MERGED_SPEC" | sed -E 's|specs/level_([0-9]+)/v[0-9]+\.md|\1|')
          VERSION=$(echo "$MERGED_SPEC" | sed -E 's|specs/level_[0-9]+/v([0-9]+)\.md|\1|')
          NEXT_VERSION_FILE="specs/level_${LEVEL}/next_version"
          
          # Validate: only promote if version matches expected next version
          if [ -f "$NEXT_VERSION_FILE" ]; then
            EXPECTED_VERSION=$(cat "$NEXT_VERSION_FILE" | tr -d '[:space:]')
            if [ "$VERSION" != "$EXPECTED_VERSION" ]; then
              echo "Version mismatch: found v${VERSION} but next_version expects v${EXPECTED_VERSION}. Skipping promotion."
              echo "has_version=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          
          echo "Detected merged spec: $MERGED_SPEC"
          
          # Find the PR that added this spec (look for _pr files)
          PR_FILE=$(ls -1 levels/level_${LEVEL}_v${VERSION}_pr*.html 2>/dev/null | head -n 1)
          if [ -z "$PR_FILE" ]; then
            echo "ERROR: No PR preview file found for level ${LEVEL} v${VERSION}"
            echo "has_version=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          PR_NUMBER=$(echo "$PR_FILE" | sed -E 's|levels/level_[0-9]+_v[0-9]+_pr([0-9]+)\.html|\1|')
          echo "Found PR preview: $PR_FILE (PR #${PR_NUMBER})"
          
          CANONICAL_FILE="levels/level_${LEVEL}.html"
          VERSIONED_FILE="levels/level_${LEVEL}_v${VERSION}.html"
          CREDITS_FILE="credits/level_${LEVEL}_credits.md"
          
          echo "level=$LEVEL" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "merged_spec=$MERGED_SPEC" >> $GITHUB_OUTPUT
          echo "pr_file=$PR_FILE" >> $GITHUB_OUTPUT
          echo "canonical_file=$CANONICAL_FILE" >> $GITHUB_OUTPUT
          echo "versioned_file=$VERSIONED_FILE" >> $GITHUB_OUTPUT
          echo "next_version_file=$NEXT_VERSION_FILE" >> $GITHUB_OUTPUT
          echo "credits_file=$CREDITS_FILE" >> $GITHUB_OUTPUT
          echo "has_version=true" >> $GITHUB_OUTPUT

      - name: Promote to canonical and versioned paths
        if: steps.detect.outputs.has_version == 'true'
        run: |
          LEVEL="${{ steps.detect.outputs.level }}"
          VERSION="${{ steps.detect.outputs.version }}"
          PR_NUMBER="${{ steps.detect.outputs.pr_number }}"
          PR_FILE="${{ steps.detect.outputs.pr_file }}"
          CANONICAL_FILE="${{ steps.detect.outputs.canonical_file }}"
          VERSIONED_FILE="${{ steps.detect.outputs.versioned_file }}"
          
          # Preserve v0 baseline on first promotion
          V0_FILE="levels/level_${LEVEL}_v0.html"
          if [ "$VERSION" = "1" ] && [ ! -f "$V0_FILE" ]; then
            git show HEAD~1:"$CANONICAL_FILE" > "$V0_FILE" 2>/dev/null || cp "$CANONICAL_FILE" "$V0_FILE"
            echo "Preserved v0 baseline: $V0_FILE"
          fi
          
          # Copy PR file to canonical and versioned paths
          cp "$PR_FILE" "$CANONICAL_FILE"
          cp "$PR_FILE" "$VERSIONED_FILE"
          echo "Promoted $PR_FILE -> $CANONICAL_FILE"
          echo "Promoted $PR_FILE -> $VERSIONED_FILE"
          
          # Also copy screenshot and video to canonical names
          PR_SCREENSHOT="screenshots/level_${LEVEL}/level_${LEVEL}_v${VERSION}_pr${PR_NUMBER}.png"
          VERSIONED_SCREENSHOT="screenshots/level_${LEVEL}/level_${LEVEL}_v${VERSION}.png"
          if [ -f "$PR_SCREENSHOT" ]; then
            cp "$PR_SCREENSHOT" "$VERSIONED_SCREENSHOT"
            echo "Promoted screenshot: $PR_SCREENSHOT -> $VERSIONED_SCREENSHOT"
          fi
          
          PR_VIDEO="screenshots/level_${LEVEL}/level_${LEVEL}_v${VERSION}_pr${PR_NUMBER}.webm"
          VERSIONED_VIDEO="screenshots/level_${LEVEL}/level_${LEVEL}_v${VERSION}.webm"
          if [ -f "$PR_VIDEO" ]; then
            cp "$PR_VIDEO" "$VERSIONED_VIDEO"
            echo "Promoted video: $PR_VIDEO -> $VERSIONED_VIDEO"
          fi

      - name: Increment next_version
        if: steps.detect.outputs.has_version == 'true'
        run: |
          NEXT_VERSION_FILE="${{ steps.detect.outputs.next_version_file }}"
          CURRENT=$(cat "$NEXT_VERSION_FILE" | tr -d '[:space:]')
          NEXT=$((CURRENT + 1))
          echo "$NEXT" > "$NEXT_VERSION_FILE"
          echo "Updated next_version: $CURRENT -> $NEXT"

      - name: Update credits
        if: steps.detect.outputs.has_version == 'true'
        run: |
          CREDITS_FILE="${{ steps.detect.outputs.credits_file }}"
          LEVEL="${{ steps.detect.outputs.level }}"
          VERSION="${{ steps.detect.outputs.version }}"
          
          # Get the PR author from the merge commit
          AUTHOR=$(git log -1 --format='%an' HEAD)
          
          # Try to get PR author from the merge commit if available
          PR_NUMBER=$(git log -1 --format='%B' HEAD | grep -oE '#[0-9]+' | head -n 1 | tr -d '#')
          if [ -n "$PR_NUMBER" ]; then
            echo "Detected PR #${PR_NUMBER}"
          fi
          
          # Append to credits file
          echo "- ${AUTHOR} — v${VERSION}" >> "$CREDITS_FILE"
          echo "Updated credits: Added ${AUTHOR} for v${VERSION}"

      - name: Update README.md
        if: steps.detect.outputs.has_version == 'true'
        run: |
          LEVEL="${{ steps.detect.outputs.level }}"
          VERSION="${{ steps.detect.outputs.version }}"
          AUTHOR=$(git log -1 --format='%an' HEAD)
          DATE=$(date +%Y-%m-%d)
          SPEC_FILE="specs/level_${LEVEL}/v${VERSION}.md"
          
          # Read spec for description (first line, max 100 chars)
          SPEC_DESC="Generated from community spec"
          if [ -f "$SPEC_FILE" ]; then
            FIRST_LINE=$(head -n 1 "$SPEC_FILE" | sed 's/^#* *//' | cut -c1-100)
            if [ -n "$FIRST_LINE" ]; then
              SPEC_DESC="$FIRST_LINE"
            fi
          fi
          
          node -e "
            const fs = require('fs');
            let readme = fs.readFileSync('README.md', 'utf8');
            
            const version = '${VERSION}';
            const level = '${LEVEL}';
            const author = '${AUTHOR}';
            const date = '${DATE}';
            const desc = '${SPEC_DESC}';
            
            // Update Official Releases table for Level 1
            const levelTableRegex = new RegExp('(### Level ' + level + '\s*\n\s*\n| Version \| Author \| Play \| Description \|\s*\n|[-|\s]+\|\s*\n)');
            const levelMatch = readme.match(levelTableRegex);
            
            if (levelMatch) {
              const newRow = '| **v' + version + '** | ' + author + ' | [Play](levels/level_' + level + '_v' + version + '.html) | ' + desc + ' |\n';
              readme = readme.slice(0, levelMatch.index + levelMatch[0].length) + newRow + readme.slice(levelMatch.index + levelMatch[0].length);
            }
            
            // Update Release Log
            const logMatch = readme.match(/(## Release Log\s*\n\s*\n| Version \| Date \| Juice-Man \| Changes \|\s*\n|[-|\s]+\|\s*\n)/);
            if (logMatch) {
              const newLogRow = '| v' + version + ' | ' + date + ' | ' + author + ' | ' + desc + ' |\n';
              readme = readme.slice(0, logMatch.index + logMatch[0].length) + newLogRow + readme.slice(logMatch.index + logMatch[0].length);
            }
            
            // Update Current Status
            readme = readme.replace(
              /## Current Status\s*\n\s*\n.*?\n\n/,
              '## Current Status\n\nNightly builds active. Latest: **Level ' + level + ' v' + version + '** — ' + desc + '\n\n'
            );
            
            fs.writeFileSync('README.md', readme);
            console.log('README.md updated');
          "

      - name: Commit promotion changes
        if: steps.detect.outputs.has_version == 'true'
        run: |
          git config user.name "juice-man-bot"
          git config user.email "bot@juice-man.dev"
          
          LEVEL="${{ steps.detect.outputs.level }}"
          VERSION="${{ steps.detect.outputs.version }}"
          CANONICAL_FILE="${{ steps.detect.outputs.canonical_file }}"
          VERSIONED_FILE="${{ steps.detect.outputs.versioned_file }}"
          NEXT_VERSION_FILE="${{ steps.detect.outputs.next_version_file }}"
          CREDITS_FILE="${{ steps.detect.outputs.credits_file }}"
          V0_FILE="levels/level_${LEVEL}_v0.html"
          VERSIONED_SCREENSHOT="screenshots/level_${LEVEL}/level_${LEVEL}_v${VERSION}.png"
          VERSIONED_VIDEO="screenshots/level_${LEVEL}/level_${LEVEL}_v${VERSION}.webm"
          
          git add "$CANONICAL_FILE" "$VERSIONED_FILE" "$NEXT_VERSION_FILE" "$CREDITS_FILE" README.md
          
          # Also add v0 file if it was just created
          if [ -f "$V0_FILE" ]; then
            git add "$V0_FILE"
          fi
          
          # Add promoted screenshot and video if they exist
          if [ -f "$VERSIONED_SCREENSHOT" ]; then
            git add "$VERSIONED_SCREENSHOT"
          fi
          if [ -f "$VERSIONED_VIDEO" ]; then
            git add "$VERSIONED_VIDEO"
          fi
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Promote level ${LEVEL} v${VERSION} to canonical path"
            git push origin main
            echo "Committed and pushed promotion changes"
          fi

      - name: Configure Pages
        if: steps.detect.outputs.has_version == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages Artifact
        if: steps.detect.outputs.has_version == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        if: steps.detect.outputs.has_version == 'true'
        id: deployment
        uses: actions/deploy-pages@v4