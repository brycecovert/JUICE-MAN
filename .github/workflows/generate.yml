name: Generate JUICE-MAN Version
on:
  pull_request_target:
    types: [opened, synchronize]
    branches: [main]
    paths:
      - 'specs/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  # ============================================================================
  # JOB 1: Validate the spec file
  # ============================================================================
  validate:
    runs-on: ubuntu-latest
    outputs:
      spec_file: ${{ steps.find_spec.outputs.spec_file }}
      level: ${{ steps.find_spec.outputs.level }}
      version: ${{ steps.find_spec.outputs.version }}
      pr_number: ${{ github.event.number }}
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Ensure origin/main is available
        run: |
          git fetch origin main
          echo "origin/main is at: $(git rev-parse origin/main)"

      - name: Find spec file in PR
        id: find_spec
        run: |
          # Method 1: Check what files were added compared to main
          SPEC_FILE=$(git diff --name-only --diff-filter=A origin/main..HEAD 2>/dev/null | grep -E '^specs/level_[0-9]+/v[0-9]+\.md$' | head -n 1)
          
          # Method 2: Find files in working tree that don't exist in main
          if [ -z "$SPEC_FILE" ]; then
            echo "Diff method failed, comparing working tree against origin/main..."
            SPEC_FILE=$(comm -23 \
              <(find specs -maxdepth 2 -name 'v*.md' 2>/dev/null | grep -E '^specs/level_[0-9]+/v[0-9]+\.md$' | sort) \
              <(git ls-tree -r --name-only origin/main 2>/dev/null | grep -E '^specs/level_[0-9]+/v[0-9]+\.md$' | sort) \
              | head -n 1)
          fi
          
          if [ -z "$SPEC_FILE" ]; then
            echo "ERROR: No spec file found. Expected path: specs/level_N/vN.md"
            exit 1
          fi
          
          if [ ! -f "$SPEC_FILE" ]; then
            echo "ERROR: Spec file not found in working tree: $SPEC_FILE"
            exit 1
          fi
          
          echo "spec_file=$SPEC_FILE" >> $GITHUB_OUTPUT
          LEVEL=$(echo "$SPEC_FILE" | sed -E 's|specs/level_([0-9]+)/v[0-9]+\.md|\1|')
          VERSION=$(echo "$SPEC_FILE" | sed -E 's|specs/level_[0-9]+/v([0-9]+)\.md|\1|')
          echo "level=$LEVEL" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Found spec: $SPEC_FILE (level $LEVEL, version $VERSION)"

      - name: Validate spec word count
        run: |
          SPEC_FILE="${{ steps.find_spec.outputs.spec_file }}"
          WORD_COUNT=$(wc -w < "$SPEC_FILE")
          echo "Spec word count: $WORD_COUNT"
          if [ "$WORD_COUNT" -gt 300 ]; then
            echo "ERROR: Spec exceeds 300 words (found $WORD_COUNT)"
            exit 1
          fi
          echo "Word count OK ($WORD_COUNT ≤ 300)"

      - name: Validate version matches next_version
        run: |
          LEVEL="${{ steps.find_spec.outputs.level }}"
          VERSION="${{ steps.find_spec.outputs.version }}"
          NEXT_VERSION_FILE="specs/level_${LEVEL}/next_version"
          
          git show origin/main:${NEXT_VERSION_FILE} > /tmp/next_version_from_main 2>/dev/null || {
            echo "ERROR: Could not read ${NEXT_VERSION_FILE} from main branch"
            exit 1
          }
          EXPECTED_VERSION=$(cat /tmp/next_version_from_main | tr -d '[:space:]')
          echo "Expected version (from main): $EXPECTED_VERSION"
          echo "PR version: $VERSION"
          
          if [ "$VERSION" != "$EXPECTED_VERSION" ]; then
            echo "ERROR: Version mismatch. Expected v${EXPECTED_VERSION}, got v${VERSION}"
            exit 1
          fi
          echo "Version match OK"

  # ============================================================================
  # JOB 2: Generate the HTML file using AI
  # ============================================================================
  generate:
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      generated_file: ${{ steps.generate.outputs.generated_file }}
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Ensure origin/main is available
        run: |
          git fetch origin main

      - name: Copy previous version to target path
        run: |
          LEVEL="${{ needs.validate.outputs.level }}"
          VERSION="${{ needs.validate.outputs.version }}"
          PR_NUMBER="${{ github.event.number }}"
          CANONICAL_FILE="levels/level_${LEVEL}.html"
          TARGET_FILE="levels/level_${LEVEL}_v${VERSION}_pr${PR_NUMBER}.html"
          
          if git show origin/main:${CANONICAL_FILE} > "${TARGET_FILE}" 2>/dev/null; then
            echo "Copied previous version to: ${TARGET_FILE}"
            wc -l "${TARGET_FILE}"
          else
            echo "WARNING: Could not find ${CANONICAL_FILE} on main branch"
            echo "This might be a new level. Using empty baseline."
            echo "<!-- New level baseline -->" > "${TARGET_FILE}"
          fi

      - name: Get npm global prefix
        id: npm_prefix
        run: |
          echo "prefix=$(npm prefix -g)" >> $GITHUB_OUTPUT

      - name: Cache npm global packages
        id: cache_npm_global
        uses: actions/cache@v4
        with:
          path: ${{ steps.npm_prefix.outputs.prefix }}/lib/node_modules
          key: npm-global-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/package.json') }}-opencode-agent-browser
          restore-keys: |
            npm-global-${{ runner.os }}-

      - name: Install opencode
        if: steps.cache_npm_global.outputs.cache-hit != 'true'
        run: |
          npm install -g opencode-ai
          which opencode
          opencode --version

      - name: Verify opencode
        if: steps.cache_npm_global.outputs.cache-hit == 'true'
        run: |
          which opencode || { npm install -g opencode-ai; }
          opencode --version

      - name: Configure OpenRouter provider
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          mkdir -p ~/.local/share/opencode
          printf '{"openrouter":{"type":"api","key":"%s"}}\n' "${OPENROUTER_API_KEY}" > ~/.local/share/opencode/auth.json
          opencode providers list

      - name: Generate new version with AI
        id: generate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TARGET_FILE: "levels/level_${{ needs.validate.outputs.level }}_v${{ needs.validate.outputs.version }}_pr${{ github.event.number }}.html"
          SPEC_FILE: "${{ needs.validate.outputs.spec_file }}"
        run: |
          echo "================================"
          echo "AI GENERATION STEP"
          echo "================================"
          echo "TARGET_FILE: $TARGET_FILE"
          echo "SPEC_FILE: $SPEC_FILE"
          
          OPENROUTER_API_KEY="${OPENROUTER_API_KEY}" opencode run \
            --dangerously-skip-permissions \
            -m moonshotai/kimi-k2.6 \
            --title "Generate JUICE-MAN v${{ needs.validate.outputs.version }}" \
            <<< "/juice-man-generate"
          
          echo "generated_file=$TARGET_FILE" >> $GITHUB_OUTPUT
          echo "Generation complete"

      - name: Verify generated file
        run: |
          GENERATED_FILE="${{ steps.generate.outputs.generated_file }}"
          if [ -f "$GENERATED_FILE" ]; then
            echo "Generated file exists: $GENERATED_FILE"
            wc -l "$GENERATED_FILE"
          else
            echo "ERROR: Generated file not found: $GENERATED_FILE"
            exit 1
          fi

      - name: Upload generated artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-html
          path: levels/level_${{ needs.validate.outputs.level }}_v${{ needs.validate.outputs.version }}_pr${{ github.event.number }}.html
          retention-days: 1

  # ============================================================================
  # JOB 3: Test the generated file (browser validation)
  # ============================================================================
  test:
    runs-on: ubuntu-latest
    needs: [validate, generate]
    outputs:
      error_count: ${{ steps.browser_test.outputs.error_count }}
      error_count_after_fix: ${{ steps.browser_test_2.outputs.error_count }}
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Download generated artifact
        uses: actions/download-artifact@v4
        with:
          name: generated-html
          path: levels/

      - name: Verify generated file
        run: |
          LEVEL="${{ needs.validate.outputs.level }}"
          VERSION="${{ needs.validate.outputs.version }}"
          PR_NUMBER="${{ github.event.number }}"
          OUTPUT_FILE="levels/level_${LEVEL}_v${VERSION}_pr${PR_NUMBER}.html"
          
          if [ -f "$OUTPUT_FILE" ]; then
            echo "Generated file exists: $OUTPUT_FILE"
            wc -l "$OUTPUT_FILE"
          else
            echo "ERROR: Generated file not found: $OUTPUT_FILE"
            ls -la levels/
            exit 1
          fi

      - name: Verify generated JavaScript syntax
        run: |
          LEVEL="${{ needs.validate.outputs.level }}"
          VERSION="${{ needs.validate.outputs.version }}"
          PR_NUMBER="${{ github.event.number }}"
          OUTPUT_FILE="levels/level_${LEVEL}_v${VERSION}_pr${PR_NUMBER}.html"

          echo "Checking JavaScript syntax in $OUTPUT_FILE..."
          node -e "const fs=require('fs');const js=fs.readFileSync('${OUTPUT_FILE}','utf8').match(/<script>([\s\S]*?)<\/script>/)[1];fs.writeFileSync('/tmp/extracted.js',js);" || {
            echo "ERROR: Failed to extract JavaScript from ${OUTPUT_FILE}"
            exit 1
          }
          node --check /tmp/extracted.js || {
            echo "ERROR: JavaScript syntax check failed"
            cat -n /tmp/extracted.js | head -n 50
            exit 1
          }
          echo "JavaScript syntax OK"

      - name: Get npm global prefix
        id: npm_prefix
        run: |
          echo "prefix=$(npm prefix -g)" >> $GITHUB_OUTPUT

      - name: Cache npm global packages
        id: cache_npm_global
        uses: actions/cache@v4
        with:
          path: ${{ steps.npm_prefix.outputs.prefix }}/lib/node_modules
          key: npm-global-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/package.json') }}-opencode-agent-browser
          restore-keys: |
            npm-global-${{ runner.os }}-

      - name: Cache agent-browser Chrome
        id: cache_agent_browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/agent-browser
          key: agent-browser-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/package.json') }}
          restore-keys: |
            agent-browser-${{ runner.os }}-

      - name: Install agent-browser and opencode
        if: steps.cache_npm_global.outputs.cache-hit != 'true'
        run: |
          npm install -g agent-browser opencode-ai
          which agent-browser
          agent-browser --version
          which opencode
          opencode --version

      - name: Verify agent-browser and opencode
        if: steps.cache_npm_global.outputs.cache-hit == 'true'
        run: |
          which agent-browser || { npm install -g agent-browser; }
          agent-browser --version
          which opencode || { npm install -g opencode-ai; }
          opencode --version

      - name: Install Chrome for agent-browser
        if: steps.cache_agent_browser.outputs.cache-hit != 'true'
        run: |
          agent-browser install --with-deps

      - name: Verify Chrome installation
        if: steps.cache_agent_browser.outputs.cache-hit == 'true'
        run: |
          agent-browser install --with-deps || echo "Chrome reinstall needed"

      - name: Configure OpenRouter provider
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          mkdir -p ~/.local/share/opencode
          printf '{"openrouter":{"type":"api","key":"%s"}}\n' "${OPENROUTER_API_KEY}" > ~/.local/share/opencode/auth.json

      - name: Browser test and validate
        id: browser_test
        run: |
          LEVEL="${{ needs.validate.outputs.level }}"
          VERSION="${{ needs.validate.outputs.version }}"
          PR_NUMBER="${{ github.event.number }}"
          OUTPUT_FILE="levels/level_${LEVEL}_v${VERSION}_pr${PR_NUMBER}.html"
          SCREENSHOT_DIR="screenshots/level_${LEVEL}"
          PREFIX="level_${LEVEL}_v${VERSION}_pr${PR_NUMBER}"
          
          echo "================================"
          echo "BROWSER TEST STEP"
          echo "================================"
          echo "Testing file: $OUTPUT_FILE"
          
          set +e
          ./scripts/capture-screenshot.sh "$OUTPUT_FILE" "$SCREENSHOT_DIR" "$PREFIX"
          EXIT_CODE=$?
          set -e
          
          SCREENSHOT_PATH="${SCREENSHOT_DIR}/${PREFIX}.png"
          VIDEO_PATH="${SCREENSHOT_DIR}/${PREFIX}.webm"
          ERROR_LOG="${SCREENSHOT_DIR}/${PREFIX}-errors.txt"
          
          ERROR_COUNT=0
          if [ -f "$ERROR_LOG" ]; then
            ERROR_COUNT=$(wc -l < "$ERROR_LOG" | tr -d ' ')
          fi
          
          echo "error_count=$ERROR_COUNT" >> $GITHUB_OUTPUT
          echo "screenshot_path=$SCREENSHOT_PATH" >> $GITHUB_OUTPUT
          echo "video_path=$VIDEO_PATH" >> $GITHUB_OUTPUT
          echo "error_log=$ERROR_LOG" >> $GITHUB_OUTPUT
          
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "WARNING: Found JavaScript errors"
            cat "$ERROR_LOG"
          else
            echo "No JavaScript errors found"
          fi
          
          agent-browser close
          echo "Browser test complete"

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: screenshots/level_${{ needs.validate.outputs.level }}/level_${{ needs.validate.outputs.level }}_v${{ needs.validate.outputs.version }}_pr${{ github.event.number }}.png
          retention-days: 1

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: screenshots/level_${{ needs.validate.outputs.level }}/level_${{ needs.validate.outputs.level }}_v${{ needs.validate.outputs.version }}_pr${{ github.event.number }}.webm
          retention-days: 1

      - name: Upload error log artifact
        if: steps.browser_test.outputs.error_count > 0
        uses: actions/upload-artifact@v4
        with:
          name: error-log
          path: screenshots/level_${{ needs.validate.outputs.level }}/level_${{ needs.validate.outputs.level }}_v${{ needs.validate.outputs.version }}_pr${{ github.event.number }}-errors.txt
          retention-days: 1

      - name: Fix JavaScript errors with AI
        if: steps.browser_test.outputs.error_count > 0
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          LEVEL="${{ needs.validate.outputs.level }}"
          VERSION="${{ needs.validate.outputs.version }}"
          PR_NUMBER="${{ github.event.number }}"
          OUTPUT_FILE="levels/level_${LEVEL}_v${VERSION}_pr${PR_NUMBER}.html"
          ERROR_LOG="screenshots/level_${LEVEL}/level_${LEVEL}_v${VERSION}_pr${PR_NUMBER}-errors.txt"
          
          echo "================================"
          echo "ERROR FIXING STEP"
          echo "================================"
          echo "Fixing JavaScript errors in: $OUTPUT_FILE"
          echo ""
          echo "Errors found:"
          cat "$ERROR_LOG"
          echo ""
          
          export OUTPUT_FILE="${OUTPUT_FILE}"
          export ERROR_LOG="${ERROR_LOG}"
          
          OPENROUTER_API_KEY="${OPENROUTER_API_KEY}" opencode run \
            --dangerously-skip-permissions \
            -m moonshotai/kimi-k2.6 \
            --title "Fix JS Errors in JUICE-MAN v${VERSION}" \
            <<< "/juice-man-fix"
          echo "Error fixing complete"

      - name: Re-test after fix
        if: steps.browser_test.outputs.error_count > 0
        id: browser_test_2
        run: |
          LEVEL="${{ needs.validate.outputs.level }}"
          VERSION="${{ needs.validate.outputs.version }}"
          PR_NUMBER="${{ github.event.number }}"
          OUTPUT_FILE="levels/level_${LEVEL}_v${VERSION}_pr${PR_NUMBER}.html"
          SCREENSHOT_DIR="screenshots/level_${LEVEL}"
          PREFIX="level_${LEVEL}_v${VERSION}_pr${PR_NUMBER}"
          
          echo "================================"
          echo "RE-TEST AFTER FIX"
          echo "================================"
          
          set +e
          ./scripts/capture-screenshot.sh "$OUTPUT_FILE" "$SCREENSHOT_DIR" "$PREFIX"
          EXIT_CODE=$?
          set -e
          
          SCREENSHOT_PATH="${SCREENSHOT_DIR}/${PREFIX}.png"
          VIDEO_PATH="${SCREENSHOT_DIR}/${PREFIX}.webm"
          ERROR_LOG="${SCREENSHOT_DIR}/${PREFIX}-errors.txt"
          
          ERROR_COUNT=0
          if [ -f "$ERROR_LOG" ]; then
            ERROR_COUNT=$(wc -l < "$ERROR_LOG" | tr -d ' ')
          fi
          
          echo "error_count=$ERROR_COUNT" >> $GITHUB_OUTPUT
          echo "screenshot_path=$SCREENSHOT_PATH" >> $GITHUB_OUTPUT
          echo "video_path=$VIDEO_PATH" >> $GITHUB_OUTPUT
          
          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "WARNING: Still found $ERROR_COUNT JavaScript errors after fix attempt"
            cat "$ERROR_LOG"
          else
            echo "All JavaScript errors fixed"
          fi
          
          agent-browser close

      - name: Upload fixed screenshot artifact
        if: steps.browser_test.outputs.error_count > 0
        uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: screenshots/level_${{ needs.validate.outputs.level }}/level_${{ needs.validate.outputs.level }}_v${{ needs.validate.outputs.version }}_pr${{ github.event.number }}.png
          retention-days: 1
          overwrite: true

      - name: Upload fixed video artifact
        if: steps.browser_test.outputs.error_count > 0
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: screenshots/level_${{ needs.validate.outputs.level }}/level_${{ needs.validate.outputs.level }}_v${{ needs.validate.outputs.version }}_pr${{ github.event.number }}.webm
          retention-days: 1
          overwrite: true

      - name: Upload tested HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-html
          path: levels/level_${{ needs.validate.outputs.level }}_v${{ needs.validate.outputs.version }}_pr${{ github.event.number }}.html
          retention-days: 1
          overwrite: true

  # ============================================================================
  # JOB 4: Commit generated files to main branch
  # ============================================================================
  commit:
    runs-on: ubuntu-latest
    needs: [validate, test]
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Copy artifacts to repo
        run: |
          LEVEL="${{ needs.validate.outputs.level }}"
          VERSION="${{ needs.validate.outputs.version }}"
          PR_NUMBER="${{ github.event.number }}"
          
          # Create directories
          mkdir -p "levels"
          mkdir -p "screenshots/level_${LEVEL}"
          
          # Copy HTML file (already has PR suffix in artifact name)
          SRC_HTML="artifacts/level_${LEVEL}_v${VERSION}_pr${PR_NUMBER}.html"
          DEST_HTML="levels/level_${LEVEL}_v${VERSION}_pr${PR_NUMBER}.html"
          
          if [ -f "$SRC_HTML" ]; then
            cp "$SRC_HTML" "$DEST_HTML"
            echo "Copied HTML: $DEST_HTML"
          else
            echo "ERROR: HTML artifact not found at $SRC_HTML"
            ls -la artifacts/
            exit 1
          fi
          
          # Copy screenshot (already has PR suffix in artifact name)
          SRC_SCREENSHOT="artifacts/level_${LEVEL}_v${VERSION}_pr${PR_NUMBER}.png"
          DEST_SCREENSHOT="screenshots/level_${LEVEL}/level_${LEVEL}_v${VERSION}_pr${PR_NUMBER}.png"
          
          if [ -f "$SRC_SCREENSHOT" ]; then
            cp "$SRC_SCREENSHOT" "$DEST_SCREENSHOT"
            echo "Copied screenshot: $DEST_SCREENSHOT"
          else
            echo "WARNING: Screenshot artifact not found at $SRC_SCREENSHOT"
          fi
          
          # Copy video (already has PR suffix in artifact name)
          SRC_VIDEO="artifacts/level_${LEVEL}_v${VERSION}_pr${PR_NUMBER}.webm"
          DEST_VIDEO="screenshots/level_${LEVEL}/level_${LEVEL}_v${VERSION}_pr${PR_NUMBER}.webm"
          
          if [ -f "$SRC_VIDEO" ]; then
            cp "$SRC_VIDEO" "$DEST_VIDEO"
            echo "Copied video: $DEST_VIDEO"
          else
            echo "WARNING: Video artifact not found at $SRC_VIDEO"
          fi

      - name: Commit generated files to main
        run: |
          git config user.name "juice-man-bot"
          git config user.email "bot@juice-man.dev"
          
          LEVEL="${{ needs.validate.outputs.level }}"
          VERSION="${{ needs.validate.outputs.version }}"
          PR_NUMBER="${{ github.event.number }}"
          
          git add "levels/level_${LEVEL}_v${VERSION}_pr${PR_NUMBER}.html"
          git add "screenshots/level_${LEVEL}/level_${LEVEL}_v${VERSION}_pr${PR_NUMBER}.png" 2>/dev/null || true
          git add "screenshots/level_${LEVEL}/level_${LEVEL}_v${VERSION}_pr${PR_NUMBER}.webm" 2>/dev/null || true
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Generate level ${LEVEL} v${VERSION} preview for PR #${PR_NUMBER}"
            git push origin main
            echo "Committed and pushed to main"
          fi

      - name: Update previews manifest
        run: |
          LEVEL="${{ needs.validate.outputs.level }}"
          VERSION="${{ needs.validate.outputs.version }}"
          PR_NUMBER="${{ github.event.number }}"
          REPO="${{ github.repository }}"
          
          MANIFEST_FILE="previews.json"
          
          # Read existing manifest or create empty array
          if [ -f "$MANIFEST_FILE" ]; then
            cat "$MANIFEST_FILE" > /tmp/previews_manifest.json
          else
            echo '[]' > /tmp/previews_manifest.json
          fi
          
          # Use Node.js to update JSON
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('/tmp/previews_manifest.json', 'utf8'));
            const prNumber = ${PR_NUMBER};
            const existingIndex = manifest.findIndex(p => p.pr_number === prNumber);
            
            const baseUrl = 'https://brycecovert.github.io/JUICE-MAN';
            
            const entry = {
              pr_number: prNumber,
              level: ${LEVEL},
              version: ${VERSION},
              title: 'PR #' + prNumber + ' - Level ' + ${LEVEL} + ' v' + ${VERSION},
              status: 'generated',
              game_url: baseUrl + '/levels/level_${LEVEL}_v${VERSION}_pr${PR_NUMBER}.html',
              screenshot_url: baseUrl + '/screenshots/level_${LEVEL}/level_${LEVEL}_v${VERSION}_pr${PR_NUMBER}.png',
              video_url: baseUrl + '/screenshots/level_${LEVEL}/level_${LEVEL}_v${VERSION}_pr${PR_NUMBER}.webm',
              pr_url: 'https://github.com/${REPO}/pull/' + prNumber,
              updated_at: new Date().toISOString()
            };
            
            if (existingIndex >= 0) {
              manifest[existingIndex] = entry;
            } else {
              manifest.push(entry);
            }
            
            fs.writeFileSync('${MANIFEST_FILE}', JSON.stringify(manifest, null, 2));
            console.log('Manifest updated');
          "
          
          git config user.name "juice-man-bot"
          git config user.email "bot@juice-man.dev"
          git add "$MANIFEST_FILE"
          
          if git diff --cached --quiet; then
            echo "No manifest changes"
          else
            git commit -m "Update previews manifest for PR #${PR_NUMBER}" --no-verify
            git push origin main
          fi

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const level = '${{ needs.validate.outputs.level }}';
            const version = '${{ needs.validate.outputs.version }}';
            const repo = context.repo.repo;
            const owner = context.repo.owner;
            
            const generatedFile = `levels/level_${level}_v${version}_pr${prNumber}.html`;
            const pagesUrl = `https://${owner}.github.io/${repo}/${generatedFile}`;
            const screenshotUrl = `https://${owner}.github.io/${repo}/screenshots/level_${level}/level_${level}_v${version}_pr${prNumber}.png`;
            const videoUrl = `https://${owner}.github.io/${repo}/screenshots/level_${level}/level_${level}_v${version}_pr${prNumber}.webm`;
            const diffUrl = `https://github.com/${owner}/${repo}/pull/${prNumber}/files`;
            
            const errorCount = '${{ needs.test.outputs.error_count }}';
            const fixedErrorCount = '${{ needs.test.outputs.error_count_after_fix }}';
            
            let statusText = '';
            if (fixedErrorCount && fixedErrorCount !== '') {
              if (parseInt(fixedErrorCount) === 0) {
                statusText = '✅ All JavaScript errors were fixed automatically';
              } else {
                statusText = `⚠️ ${fixedErrorCount} JavaScript errors remain after auto-fix attempt`;
              }
            } else if (parseInt(errorCount) === 0) {
              statusText = '✅ No JavaScript errors detected';
            } else {
              statusText = `⚠️ ${errorCount} JavaScript errors detected (fix attempt made)`;
            }
            
            const body = `## 🤖 JUICE-MAN Version Generated
            
            Level: **${level}** | Version: **v${version}** | PR: **#${prNumber}**
            
            ### Files
            - Generated: [\`${generatedFile}\`](https://github.com/${owner}/${repo}/blob/main/${generatedFile})
            - Diff: [View changes](${diffUrl})
            
            ### Preview
            - [Play generated version](${pagesUrl}) (via GitHub Pages)
            
