name: Generate JUICE-MAN Version
on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  validate-and-generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure origin/main is available
        run: |
          git fetch origin main --depth=1
          echo "origin/main is at: $(git rev-parse origin/main)"

      - name: Find spec file in PR
        id: find_spec
        run: |
          # Try diff against origin/main first
          SPEC_FILE=$(git diff --name-only origin/main...HEAD 2>/dev/null | grep -E '^specs/level_[0-9]+/v[0-9]+\.md$' | head -n 1)
          
          # Fallback: search working tree for spec files
          if [ -z "$SPEC_FILE" ]; then
            SPEC_FILE=$(find specs -maxdepth 2 -name 'v*.md' 2>/dev/null | grep -E '^specs/level_[0-9]+/v[0-9]+\.md$' | head -n 1)
          fi
          
          if [ -z "$SPEC_FILE" ]; then
            echo "ERROR: No spec file found. Expected path: specs/level_N/vN.md"
            exit 1
          fi
          
          if [ ! -f "$SPEC_FILE" ]; then
            echo "ERROR: Spec file not found in working tree: $SPEC_FILE"
            exit 1
          fi
          
          echo "spec_file=$SPEC_FILE" >> $GITHUB_OUTPUT
          LEVEL=$(echo "$SPEC_FILE" | sed -E 's|specs/level_([0-9]+)/v[0-9]+\.md|\1|')
          VERSION=$(echo "$SPEC_FILE" | sed -E 's|specs/level_[0-9]+/v([0-9]+)\.md|\1|')
          echo "level=$LEVEL" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Found spec: $SPEC_FILE (level $LEVEL, version $VERSION)"

      - name: Validate spec word count
        run: |
          SPEC_FILE="${{ steps.find_spec.outputs.spec_file }}"
          WORD_COUNT=$(wc -w < "$SPEC_FILE")
          echo "Spec word count: $WORD_COUNT"
          if [ "$WORD_COUNT" -gt 300 ]; then
            echo "ERROR: Spec exceeds 300 words (found $WORD_COUNT)"
            exit 1
          fi
          echo "Word count OK ($WORD_COUNT ≤ 300)"

      - name: Validate version matches next_version
        run: |
          LEVEL="${{ steps.find_spec.outputs.level }}"
          VERSION="${{ steps.find_spec.outputs.version }}"
          NEXT_VERSION_FILE="specs/level_${LEVEL}/next_version"
          
          # Fetch next_version from main branch
          git show origin/main:${NEXT_VERSION_FILE} > /tmp/next_version_from_main 2>/dev/null || {
            echo "ERROR: Could not read ${NEXT_VERSION_FILE} from main branch"
            exit 1
          }
          EXPECTED_VERSION=$(cat /tmp/next_version_from_main | tr -d '[:space:]')
          echo "Expected version (from main): $EXPECTED_VERSION"
          echo "PR version: $VERSION"
          
          if [ "$VERSION" != "$EXPECTED_VERSION" ]; then
            echo "ERROR: Version mismatch. Expected v${EXPECTED_VERSION}, got v${VERSION}"
            exit 1
          fi
          echo "Version match OK"

      - name: Copy previous version to target path
        run: |
          LEVEL="${{ steps.find_spec.outputs.level }}"
          VERSION="${{ steps.find_spec.outputs.version }}"
          CANONICAL_FILE="levels/level_${LEVEL}.html"
          TARGET_FILE="levels/level_${LEVEL}_v${VERSION}.html"
          
          if git show origin/main:${CANONICAL_FILE} > "${TARGET_FILE}" 2>/dev/null; then
            echo "Copied previous version to: ${TARGET_FILE}"
            wc -l "${TARGET_FILE}"
          else
            echo "WARNING: Could not find ${CANONICAL_FILE} on main branch"
            echo "This might be a new level. Using empty baseline."
            echo "<!-- New level baseline -->" > "${TARGET_FILE}"
          fi

      - name: Install opencode
        run: |
          echo "Installing opencode via npm..."
          npm install -g opencode-ai
          which opencode
          opencode --version
          echo "opencode installed successfully"

      - name: Install agent-browser
        run: |
          echo "Installing agent-browser via npm..."
          npm install -g agent-browser
          which agent-browser
          agent-browser --version
          echo "Installing Chrome for agent-browser..."
          agent-browser install --with-deps
          echo "agent-browser installed successfully"

      - name: Configure OpenRouter provider
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "Configuring OpenRouter provider..."
          # Write auth file directly for non-interactive CI
          mkdir -p ~/.local/share/opencode
          printf '{"openrouter":{"type":"api","key":"%s"}}\n' "${OPENROUTER_API_KEY}" > ~/.local/share/opencode/auth.json
          echo "Provider configured"
          # Verify provider is set up
          opencode providers list

      - name: Generate new version with AI
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TARGET_FILE: "levels/level_${{ steps.find_spec.outputs.level }}_v${{ steps.find_spec.outputs.version }}.html"
          SPEC_FILE: "${{ steps.find_spec.outputs.spec_file }}"
        run: |
          echo "================================"
          echo "AI GENERATION STEP"
          echo "================================"
          echo ""
          echo "Invoking juice-man-generate skill..."
          echo "TARGET_FILE: $TARGET_FILE"
          echo "SPEC_FILE: $SPEC_FILE"
          echo ""
          
          # Run opencode with skill invocation
          OPENROUTER_API_KEY="${OPENROUTER_API_KEY}" opencode run \
            --dangerously-skip-permissions \
            -m openrouter/qwen/qwen3.6-plus \
            --title "Generate JUICE-MAN v${{ steps.find_spec.outputs.version }}" \
            <<< "/juice-man-generate"
          echo "Generation complete"

      - name: Verify generated file
        run: |
          LEVEL="${{ steps.find_spec.outputs.level }}"
          VERSION="${{ steps.find_spec.outputs.version }}"
          OUTPUT_FILE="levels/level_${LEVEL}_v${VERSION}.html"
          
          if [ -f "$OUTPUT_FILE" ]; then
            echo "Generated file exists: $OUTPUT_FILE"
            wc -l "$OUTPUT_FILE"
          else
            echo "ERROR: Generated file not found: $OUTPUT_FILE"
            exit 1
          fi

      - name: Verify generated JavaScript syntax
        run: |
          LEVEL="${{ steps.find_spec.outputs.level }}"
          VERSION="${{ steps.find_spec.outputs.version }}"
          OUTPUT_FILE="levels/level_${LEVEL}_v${VERSION}.html"

          echo "Checking JavaScript syntax in $OUTPUT_FILE..."
          node -e "const fs=require('fs');const js=fs.readFileSync('${OUTPUT_FILE}','utf8').match(/<script>([\s\S]*?)<\/script>/)[1];fs.writeFileSync('/tmp/extracted.js',js);" || {
            echo "ERROR: Failed to extract JavaScript from ${OUTPUT_FILE}"
            exit 1
          }
          node --check /tmp/extracted.js || {
            echo "ERROR: JavaScript syntax check failed"
            cat -n /tmp/extracted.js | head -n 50
            exit 1
          }
          echo "JavaScript syntax OK"

      - name: Browser test and validate
        id: browser_test
        run: |
          LEVEL="${{ steps.find_spec.outputs.level }}"
          VERSION="${{ steps.find_spec.outputs.version }}"
          OUTPUT_FILE="levels/level_${LEVEL}_v${VERSION}.html"
          SCREENSHOT_DIR="screenshots/level_${LEVEL}"
          SCREENSHOT_PATH="${SCREENSHOT_DIR}/level_${LEVEL}_v${VERSION}.png"
          ERROR_LOG="/tmp/js_errors.txt"
          CONSOLE_LOG="/tmp/console_logs.json"
          
          mkdir -p "$SCREENSHOT_DIR"
          
          echo "================================"
          echo "BROWSER TEST STEP"
          echo "================================"
          echo "Testing file: $OUTPUT_FILE"
          
          # Open the HTML file in agent-browser
          agent-browser --allow-file-access open "file://$PWD/$OUTPUT_FILE"
          
          # Wait 1 second for page to load
          agent-browser wait 1000
          
          # Press space to start the game
          agent-browser press Space
          
          # Wait another second for game to react
          agent-browser wait 1000
          
          # Take screenshot
          agent-browser screenshot "$SCREENSHOT_PATH"
          echo "Screenshot saved to: $SCREENSHOT_PATH"
          
          # Collect JavaScript errors
          agent-browser errors > "$ERROR_LOG" 2>&1 || true
          echo "JS errors saved to: $ERROR_LOG"
          
          # Collect console logs
          agent-browser console --json > "$CONSOLE_LOG" 2>&1 || true
          echo "Console logs saved to: $CONSOLE_LOG"
          
          # Check if errors exist
          ERROR_COUNT=$(wc -l < "$ERROR_LOG" | tr -d ' ')
          echo "error_count=$ERROR_COUNT" >> $GITHUB_OUTPUT
          echo "screenshot_path=$SCREENSHOT_PATH" >> $GITHUB_OUTPUT
          echo "error_log=$ERROR_LOG" >> $GITHUB_OUTPUT
          
          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "WARNING: Found $ERROR_COUNT JavaScript errors"
            cat "$ERROR_LOG"
          else
            echo "No JavaScript errors found"
          fi
          
          # Close browser
          agent-browser close
          
          echo "Browser test complete"

      - name: Fix JavaScript errors with AI
        if: steps.browser_test.outputs.error_count > 0
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          LEVEL="${{ steps.find_spec.outputs.level }}"
          VERSION="${{ steps.find_spec.outputs.version }}"
          OUTPUT_FILE="levels/level_${LEVEL}_v${VERSION}.html"
          ERROR_LOG="${{ steps.browser_test.outputs.error_log }}"
          
          echo "================================"
          echo "ERROR FIXING STEP"
          echo "================================"
          echo "Fixing JavaScript errors in: $OUTPUT_FILE"
          echo ""
          echo "Errors found:"
          cat "$ERROR_LOG"
          echo ""
          
          # Run opencode with skill invocation for error fixing
          export OUTPUT_FILE="${OUTPUT_FILE}"
          export ERROR_LOG="${ERROR_LOG}"
          
          echo "Invoking juice-man-fix skill..."
          echo "OUTPUT_FILE: $OUTPUT_FILE"
          echo "ERROR_LOG: $ERROR_LOG"
          
          OPENROUTER_API_KEY="${OPENROUTER_API_KEY}" opencode run \
            --dangerously-skip-permissions \
            -m openrouter/qwen/qwen3.6-plus \
            --title "Fix JS Errors in JUICE-MAN v${VERSION}" \
            <<< "/juice-man-fix"
          echo "Error fixing complete"

      - name: Re-test after fix
        if: steps.browser_test.outputs.error_count > 0
        id: browser_test_2
        run: |
          LEVEL="${{ steps.find_spec.outputs.level }}"
          VERSION="${{ steps.find_spec.outputs.version }}"
          OUTPUT_FILE="levels/level_${LEVEL}_v${VERSION}.html"
          SCREENSHOT_DIR="screenshots/level_${LEVEL}"
          SCREENSHOT_PATH="${SCREENSHOT_DIR}/level_${LEVEL}_v${VERSION}.png"
          ERROR_LOG="/tmp/js_errors_fixed.txt"
          
          mkdir -p "$SCREENSHOT_DIR"
          
          echo "================================"
          echo "RE-TEST AFTER FIX"
          echo "================================"
          
          # Re-open and test
          agent-browser --allow-file-access open "file://$PWD/$OUTPUT_FILE"
          agent-browser wait 1000
          agent-browser press Space
          agent-browser wait 1000
          agent-browser screenshot "$SCREENSHOT_PATH"
          agent-browser errors > "$ERROR_LOG" 2>&1 || true
          
          ERROR_COUNT=$(wc -l < "$ERROR_LOG" | tr -d ' ')
          echo "error_count=$ERROR_COUNT" >> $GITHUB_OUTPUT
          echo "screenshot_path=$SCREENSHOT_PATH" >> $GITHUB_OUTPUT
          
          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "WARNING: Still found $ERROR_COUNT JavaScript errors after fix attempt"
            cat "$ERROR_LOG"
          else
            echo "All JavaScript errors fixed"
          fi
          
          agent-browser close

      - name: Commit generated file and screenshot to PR branch
        run: |
          git config user.name "juice-man-bot"
          git config user.email "bot@juice-man.dev"

          LEVEL="${{ steps.find_spec.outputs.level }}"
          VERSION="${{ steps.find_spec.outputs.version }}"
          OUTPUT_FILE="levels/level_${LEVEL}_v${VERSION}.html"
          SCREENSHOT_DIR="screenshots/level_${LEVEL}"
          SCREENSHOT_PATH="${SCREENSHOT_DIR}/level_${LEVEL}_v${VERSION}.png"

          git add "$OUTPUT_FILE"
          
          # Also add screenshot if it exists
          if [ -f "$SCREENSHOT_PATH" ]; then
            git add "$SCREENSHOT_PATH"
          fi
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Generate level ${LEVEL} v${VERSION} from spec"
            git push origin HEAD:${{ github.head_ref }}
            echo "Committed and pushed generated file and screenshot"
          fi

      - name: Upload screenshot to PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const level = '${{ steps.find_spec.outputs.level }}';
            const version = '${{ steps.find_spec.outputs.version }}';
            
            const repo = context.repo.repo;
            const owner = context.repo.owner;
            const branch = context.payload.pull_request.head.ref;
            
            const screenshotUrl = `https://github.com/${owner}/${repo}/blob/${branch}/screenshots/level_${level}/level_${level}_v${version}.png?raw=true`;
            
            const errorCount = '${{ steps.browser_test.outputs.error_count }}';
            const fixedErrorCount = '${{ steps.browser_test_2.outputs.error_count }}';
            
            let statusText = '';
            if (fixedErrorCount && fixedErrorCount !== '') {
              if (parseInt(fixedErrorCount) === 0) {
                statusText = '✅ All JavaScript errors were fixed automatically';
              } else {
                statusText = `⚠️ ${fixedErrorCount} JavaScript errors remain after auto-fix attempt`;
              }
            } else if (parseInt(errorCount) === 0) {
              statusText = '✅ No JavaScript errors detected';
            } else {
              statusText = `⚠️ ${errorCount} JavaScript errors detected (fix attempt made)`;
            }
            
            // Create or update comment with screenshot
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber
            });
            
            const screenshotComment = comments.find(c => c.user.login === 'github-actions[bot]' && c.body.includes('Browser Test Screenshot'));
            
            const body = `## 🖼️ Browser Test Screenshot
            
            Level: **${level}** | Version: **v${version}**
            
            ### Screenshot
            ![JUICE-MAN Screenshot](${screenshotUrl})
            
            ### JavaScript Validation
            ${statusText}
            
            ---
            *Screenshot taken after pressing space to start the game.*`;
            
            if (screenshotComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: screenshotComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body
              });
            }

      - name: Update previews manifest
        run: |
          LEVEL="${{ steps.find_spec.outputs.level }}"
          VERSION="${{ steps.find_spec.outputs.version }}"
          PR_NUMBER="${{ github.event.number }}"
          
          MANIFEST_FILE="previews.json"
          
          # Read existing manifest or create empty array
          if [ -f "$MANIFEST_FILE" ]; then
            cat "$MANIFEST_FILE" > /tmp/previews_manifest.json
          else
            echo '[]' > /tmp/previews_manifest.json
          fi
          
          # Use Node.js to update JSON (available in ubuntu-latest)
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('/tmp/previews_manifest.json', 'utf8'));
            const prNumber = ${PR_NUMBER};
            const existingIndex = manifest.findIndex(p => p.pr_number === prNumber);
            
            const entry = {
              pr_number: prNumber,
              level: ${LEVEL},
              version: ${VERSION},
              title: 'PR #' + prNumber + ' - Level ' + ${LEVEL} + ' v' + ${VERSION},
              preview_url: 'https://htmlpreview.github.io/?https://github.com/${{ github.repository }}/blob/${{ github.head_ref }}/levels/level_${LEVEL}_v${VERSION}.html',
              status: 'generated',
              updated_at: new Date().toISOString()
            };
            
            if (existingIndex >= 0) {
              manifest[existingIndex] = entry;
            } else {
              manifest.push(entry);
            }
            
            fs.writeFileSync('${MANIFEST_FILE}', JSON.stringify(manifest, null, 2));
            console.log('Manifest updated');
          "
          
          git config user.name "juice-man-bot"
          git config user.email "bot@juice-man.dev"
          git add "$MANIFEST_FILE"
          
          if git diff --cached --quiet; then
            echo "No manifest changes"
          else
            git commit -m "Update previews manifest for PR #${PR_NUMBER}"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const level = '${{ steps.find_spec.outputs.level }}';
            const version = '${{ steps.find_spec.outputs.version }}';
            const repo = context.repo.repo;
            const owner = context.repo.owner;
            const branch = context.payload.pull_request.head.ref;
            
            const generatedFile = `levels/level_${level}_v${version}.html`;
            const previewUrl = `https://htmlpreview.github.io/?https://github.com/${owner}/${repo}/blob/${branch}/${generatedFile}`;
            const diffUrl = `https://github.com/${owner}/${repo}/pull/${prNumber}/files`;
            
            const body = `## 🤖 JUICE-MAN Version Generated
            
            Level: **${level}** | Version: **v${version}**
            
            ### Files
            - Generated: [\`${generatedFile}\`](https://github.com/${owner}/${repo}/blob/${branch}/${generatedFile})
            - Diff: [View changes](${diffUrl})
            
            ### Preview
            - [Play generated version](${previewUrl}) (via HTMLPreview)
            
            ### Status
            ✅ Generation successful
            
            ---
            *This comment will be updated on each push.*`;
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber
            });
            
            const botComment = comments.find(c => c.user.login === 'github-actions[bot]' && c.body.includes('JUICE-MAN Version Generated'));
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body
              });
            }


